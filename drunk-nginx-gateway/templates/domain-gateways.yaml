# Single shared Gateway serving every enabled domain's listeners.
# NGF provisions one nginx data plane + one LoadBalancer Service per Gateway, so
# collapsing all domains into ONE Gateway yields ONE internal IP. Per-domain TLS
# is preserved: each domain keeps its own HTTPS listener + wildcard cert, selected
# at runtime by SNI. Listener names are prefixed with the domain to stay unique.
{{- if .Values.gateway.enabled }}
{{- $root := . }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ include "gateway.ns" $root }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "gateway.labels" $root | nindent 4 }}
    app.kubernetes.io/component: shared-gateway
    {{- with .Values.gateway.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.gatewayClassName }}
  listeners:
  {{- range $domain := .Values.domains }}
  {{- if $domain.enabled }}
  {{- range $domain.listeners }}
  - name: {{ $domain.name }}-{{ .name }}
    protocol: {{ .protocol }}
    port: {{ .port }}
    {{- if .hostname }}
    hostname: {{ .hostname | quote }}
    {{- end }}
    {{- with .tls }}
    tls:
      {{- toYaml . | nindent 6 }}
    {{- end }}
    {{- if .allowedRoutes }}
    allowedRoutes:
      {{- toYaml .allowedRoutes | nindent 6 }}
    {{- else }}
      {{- with $root.Values.routeAccess }}
    allowedRoutes:
      namespaces:
        {{- if eq .mode "All" }}
        from: All
        {{- else if eq .mode "Same" }}
        from: Same
        {{- else if eq .mode "List" }}
        from: Selector
        selector:
          matchLabels:
            {{ .labelKey }}: {{ .labelValue | quote }}
        {{- else }}
        from: Same
        {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
  {{- end }}
  {{- end }}
{{- end }}
