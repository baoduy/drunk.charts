# SecretProviderClass — syncs the Cloudflare DNS-01 API token from Azure Key
# Vault into the `cf-dns-secret` Kubernetes Secret consumed by the ClusterIssuer
# (templates/clusterissuer.yaml). Replaces the manual `kubectl create secret`.
#
# NOTE: a SecretProviderClass only *materializes* its `secretObjects` Secret once
# a pod mounts the SPC volume. The cert-manager controller mounts it — see the
# `cert-manager.volumes/volumeMounts` block in values.yaml.
{{- $sp := .Values.secretProvider -}}
{{- if and $sp $sp.enabled }}
{{- $provider := $sp.provider | default dict -}}
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ $sp.name | default "cf-dns-spc" }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
spec:
  provider: {{ $provider.name | default "azure" }}
  parameters:
    usePodIdentity: {{ $provider.usePodIdentity | default false | quote }}
    useWorkloadIdentity: {{ $provider.useWorkloadIdentity | default false | quote }}
    useVMManagedIdentity: {{ $provider.useVMManagedIdentity | default true | quote }}
    userAssignedIdentityID: {{ $provider.userAssignedIdentityID | quote }}
    tenantId: {{ $provider.tenantId | quote }}
    keyvaultName: {{ $provider.vaultName | quote }}
    objects: |
      array:
        {{- range $obj := $sp.objects }}
        - |
          objectName: {{ $obj }}
          objectType: secret
        {{- end }}
  secretObjects:
    - secretName: {{ $sp.secretName | default "cf-dns-secret" }}
      type: Opaque
      data:
        {{- range $so := $sp.secretObjects }}
        - key: {{ $so.key }}
          objectName: {{ $so.objectName }}
        {{- end }}
{{- end }}
