---
# Source: drunk-app/templates/pdb.yaml
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: test-release-drunk-app
  labels:
    helm.sh/chart: drunk-app-2.0.1
    app.kubernetes.io/name: drunk-app
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
spec:
  minAvailable: 1
  unhealthyPodEvictionPolicy: AlwaysAllow
  selector:
    matchLabels:
      app.kubernetes.io/name: drunk-app
      app.kubernetes.io/instance: test-release
---
# Source: drunk-app/templates/service.yaml
# Service — exposes the application's ports inside the cluster.
# Port source resolution: service.ports → deployment.ports
# Set service.enabled: false to suppress this resource.
apiVersion: v1
kind: Service
metadata:
  name: test-release-drunk-app
  labels: 
    helm.sh/chart: drunk-app-2.0.1
    app.kubernetes.io/name: drunk-app
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
    - port: 8443
      targetPort: https
      protocol: TCP
      name: https
  selector: 
    app.kubernetes.io/name: drunk-app
    app.kubernetes.io/instance: test-release
---
# Source: drunk-app/templates/deployment.yaml
# Generate Deployment resource for long-running application workloads
# Creates a Deployment when .Values.deployment.enabled is true
# Supports comprehensive configuration including:
# - Replica count, update strategy, and deployment settings
# - Init containers for setup tasks (.Values.global.initContainer)
# - Main application container with ports, probes, resources
# - Environment variables, secrets, and configmaps
# - Volume mounts for persistent storage and secret management
# - Security contexts, service accounts, and scheduling
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-release-drunk-app
  labels:
    helm.sh/chart: drunk-app-2.0.1
    app.kubernetes.io/name: drunk-app
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
spec:
  minReadySeconds: 10
  progressDeadlineSeconds: 600
  revisionHistoryLimit: 5
# Deployment strategy configuration
  strategy:
    type: RollingUpdate
    # Rolling update parameters for RollingUpdate strategy
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  # Pod selector using standard labels
  selector:
    matchLabels:
      app.kubernetes.io/name: drunk-app
      app.kubernetes.io/instance: test-release
  template:
    metadata:
      annotations:
        # Checksums trigger pod restart when configs/secrets change
        
        # Additional pod annotations from .Values.deployment.podAnnotations
      labels:
        app.kubernetes.io/name: drunk-app
        app.kubernetes.io/instance: test-release
    spec:
      # Security: disable automatic service account token mounting
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      # Image pull secrets for private registries
      # Service account configuration from .Values.serviceAccount
      # Pod security context from .Values.podSecurityContext
      securityContext:
        fsGroup: 10000
        runAsGroup: 10000
        runAsUser: 10000
      # Init containers for setup tasks (optional)

      # Begin Containers - main application containers
      containers:
        - name: drunk-app
          # Main container security context from .Values.securityContext
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          # Container image from .Values.global.image and .Values.global.tag
          image: "example/app:1.0.0"
          imagePullPolicy: "Always"
          # Container command override from .Values.deployment.command
          # Container arguments from .Values.deployment.args
          # Container ports from .Values.deployment.ports
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
          # Health checks - liveness probe from .Values.deployment.liveness
          livenessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz
              port: https
              scheme: HTTPS
            periodSeconds: 10
          # Health checks - readiness probe from .Values.deployment.readiness
          readinessProbe:
            failureThreshold: 3
            httpGet:
              path: /healthz/ready
              port: https
              scheme: HTTPS
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 30
          lifecycle:
            preStop:
              sleep:
                seconds: 10
          # Environment variables from .Values.env
          # Environment from external sources
          envFrom:
          # ConfigMap created from .Values.configMap
          # External ConfigMaps from .Values.configFrom array
          # Secret created from .Values.secrets
          # External Secrets from .Values.secretFrom array
          # SecretProvider volume - Azure Key Vault, AWS Secrets Manager, etc.
          # Container resource limits and requests from .Values.resources
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 100m
              memory: 128Mi
          # Volume mounts for persistent storage and secrets
          volumeMounts:
          # Persistent and emptyDir volumes from .Values.volumes
          - name: tmp
            readOnly: false
            mountPath: /tmp
          # SecretProvider volume mount for external secret management
      # End Containers
      
      # Volume definitions for the pod
      volumes:
      # Volumes from .Values.volumes - PVCs or emptyDir
      - name: tmp
        emptyDir: {}
      # SecretProvider volume for external secret management systems
      
      # Pod scheduling constraints
      # Node selector from .Values.nodeSelector
      # Pod affinity rules from .Values.affinity
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - preference:
              matchExpressions:
              - key: pool
                operator: In
                values:
                - apps
            weight: 50
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: test-release
                  app.kubernetes.io/name: drunk-app
              topologyKey: kubernetes.io/hostname
            weight: 100
      topologySpreadConstraints:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/instance: test-release
              app.kubernetes.io/name: drunk-app
          maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
      # Pod tolerations from .Values.tolerations
---
# Source: drunk-app/templates/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: test-release-drunk-app
  labels:
    helm.sh/chart: drunk-app-2.0.1
    app.kubernetes.io/name: drunk-app
    app.kubernetes.io/instance: test-release
    app.kubernetes.io/version: "latest"
    app.kubernetes.io/managed-by: Helm
spec:
  # Target workload for scaling.
  # Set autoscaling.targetKind to "StatefulSet" or another workload kind when not scaling a Deployment.
  # Set autoscaling.targetApiVersion if the workload uses a non-standard API group.
  scaleTargetRef:
    apiVersion: "apps/v1"
    kind: "Deployment"
    name: test-release-drunk-app
  # Scaling boundaries from values
  minReplicas: 3
  maxReplicas: 10
  metrics:
    # CPU-based scaling - configure with .Values.autoscaling.targetCPUUtilizationPercentage
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
    # Memory-based scaling - configure with .Values.autoscaling.targetMemoryUtilizationPercentage
---
# Source: drunk-app/templates/volumes.yaml
# Only create PVC for non-emptyDir volumes
