# ── Standalone-template flexibility keys (all optional, all additive) ──────
#
# service.ports — primary port map for drunk-lib.service.
#   Same shape as deployment.ports: map of portName → containerPort.
#   When absent, drunk-lib.service falls back to deployment.ports.
#   drunk.utils.ingressPort also prefers this key over deployment.ports.
#   Example:
#     service:
#       ports:
#         http: 8080
#
# service.enabled — set to false to suppress the Service resource entirely.
#   Default: true (Service renders whenever ports are available).
#   Example:
#     service:
#       enabled: false
#
# autoscaling.targetKind — scaleTargetRef.kind in the HPA (emitted quoted).
#   Default: "Deployment". Set to "StatefulSet" for StatefulSet workloads.
#   Example:
#     autoscaling:
#       targetKind: StatefulSet
#
# autoscaling.targetApiVersion — scaleTargetRef.apiVersion in the HPA (emitted quoted).
#   Default: "apps/v1".
#   Example:
#     autoscaling:
#       targetApiVersion: apps/v1
#
# cronJobs[].enabled — per-entry flag. false skips that CronJob entry.
#   Default: true (absent key renders the entry).
#   Example:
#     cronJobs:
#       - name: nightly-report
#         schedule: "0 2 * * *"
#         enabled: false   # skip this entry
#
# jobs[].enabled — per-entry flag. false skips that Job entry.
#   Default: true (absent key renders the entry).
#   Example:
#     jobs:
#       - name: db-migrate
#         enabled: false   # skip this entry

# ── Opt-in rollout safety (Deployment and StatefulSet only) ────────────────
# deployment / statefulset:
#   liveness: "/healthz" # or raw map: httpGet / tcpSocket / exec / grpc plus timings
#   readiness: {httpGet: {path: /ready, port: https, scheme: HTTPS}, periodSeconds: 5}
#   startup: "/healthz" # or raw map; string defaults: periodSeconds 5, failureThreshold 30
#   terminationGracePeriodSeconds: 45
#   preStopSleepSeconds: 10 # native sleep, less than grace period; Kubernetes 1.30+
#   lifecycle: {} # raw lifecycle overrides convenience sleep
#   minReadySeconds: 10 # render only when present; accepts 0
# deployment:
#   progressDeadlineSeconds: 600
#   revisionHistoryLimit: 5
#   strategy: {type: RollingUpdate, maxSurge: 0, maxUnavailable: 1}
#     # max values accept integers / percentages; both cannot be 0
# autoscaling:
#   omitReplicas: false # only omits Deployment replicas when HPA enabled and targeting Deployment
# podAntiAffinityPreset: "" # "" | soft | hard; explicit affinity.podAntiAffinity wins
# topologySpreadConstraints:
#   - maxSkew: 1
#     topologyKey: topology.kubernetes.io/zone
#     whenUnsatisfiable: ScheduleAnyway
#     # absent labelSelector uses app.selectorLabels for this alias
# podDisruptionBudget:
#   enabled: false
#   minAvailable: 1 # exactly one of minAvailable / maxUnavailable
#   # maxUnavailable: "25%"
#   unhealthyPodEvictionPolicy: AlwaysAllow # default when enabled; Kubernetes 1.31+
