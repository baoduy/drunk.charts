# Acceptance tests for DRK-2043: Key Vault client id and "use VM managed identity" on the SecretProviderClass.
# Scenario names follow the approved spec (DRK-2043 §5); expected values are the spec's literals.
suite: SecretProviderClass workload identity Acceptance Test Suite
templates:
  - secretProviderClass.yaml
tests:
  # Scenario: The Key Vault client id is written when the chart sets one
  - it: "The Key Vault client id is written when the chart sets one"
    set:
      nameOverride: notification-api
      secretProvider:
        enabled: true
        provider:
          vaultName: drunk-kv
          clientID: "11111111-2222-3333-4444-555555555555"
    asserts:
      - equal:
          path: spec.parameters.keyvaultName
          value: drunk-kv
      - equal:
          path: spec.parameters.clientID
          value: "11111111-2222-3333-4444-555555555555"

  # Scenario Outline: No client id is written when the chart sets none
  - it: "No client id is written when the chart sets none (no client id)"
    set:
      nameOverride: accounts-api
      secretProvider:
        enabled: true
        provider:
          vaultName: drunk-kv
          userAssignedIdentityID: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
    asserts:
      - equal:
          path: spec.parameters.userAssignedIdentityID
          value: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
      - notExists:
          path: spec.parameters.clientID

  - it: "No client id is written when the chart sets none (an empty client id)"
    set:
      nameOverride: accounts-api
      secretProvider:
        enabled: true
        provider:
          vaultName: drunk-kv
          userAssignedIdentityID: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
          clientID: ""
    asserts:
      - equal:
          path: spec.parameters.userAssignedIdentityID
          value: "aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee"
      - notExists:
          path: spec.parameters.clientID

  # Scenario Outline: "Use VM managed identity" follows the chart's setting
  - it: "\"Use VM managed identity\" follows the chart's setting (the yes/no false -> off)"
    set:
      nameOverride: notification-api
      secretProvider:
        enabled: true
        provider:
          vaultName: drunk-kv
          useVMManagedIdentity: false
    asserts:
      - equal:
          path: spec.parameters.useVMManagedIdentity
          value: "false"

  - it: "\"Use VM managed identity\" follows the chart's setting (the text \"false\" -> off)"
    set:
      nameOverride: notification-api
      secretProvider:
        enabled: true
        provider:
          vaultName: drunk-kv
          useVMManagedIdentity: "false"
    asserts:
      - equal:
          path: spec.parameters.useVMManagedIdentity
          value: "false"

  - it: "\"Use VM managed identity\" follows the chart's setting (the yes/no true -> on)"
    set:
      nameOverride: notification-api
      secretProvider:
        enabled: true
        provider:
          vaultName: drunk-kv
          useVMManagedIdentity: true
    asserts:
      - equal:
          path: spec.parameters.useVMManagedIdentity
          value: "true"

  - it: "\"Use VM managed identity\" follows the chart's setting (no value -> on)"
    set:
      nameOverride: notification-api
      secretProvider:
        enabled: true
        provider:
          vaultName: drunk-kv
    asserts:
      - equal:
          path: spec.parameters.useVMManagedIdentity
          value: "true"

  # Input-domain cases (brief §6a D6-D8) beyond the scenario examples: render as at 2.0.3.
  - it: "AT case D6: the text \"true\" renders \"true\""
    set:
      secretProvider:
        enabled: true
        provider:
          vaultName: drunk-kv
          useVMManagedIdentity: "true"
    asserts:
      - equal:
          path: spec.parameters.useVMManagedIdentity
          value: "true"

  - it: "AT case D7: the empty text renders \"true\""
    set:
      secretProvider:
        enabled: true
        provider:
          vaultName: drunk-kv
          useVMManagedIdentity: ""
    asserts:
      - equal:
          path: spec.parameters.useVMManagedIdentity
          value: "true"

  - it: "AT case D8: other text is passed through quoted"
    set:
      secretProvider:
        enabled: true
        provider:
          vaultName: drunk-kv
          useVMManagedIdentity: "yes"
    asserts:
      - equal:
          path: spec.parameters.useVMManagedIdentity
          value: "yes"
