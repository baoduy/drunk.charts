suites: HPA Template Test Suite
templates:
- hpa.yaml
tests:
- it: should not create an HPA when autoscaling is disabled
  set:
    autoscaling:
      enabled: false
  asserts:
  - hasDocuments:
      count: 0

- it: should create an HPA with minimum settings when autoscaling is enabled
  set:
    app:
      fullname: test-app
      labels:
        app: test-app
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 3
  asserts:
  - hasDocuments:
      count: 1
  - isKind:
      of: HorizontalPodAutoscaler
  - equal:
      path: metadata.name
      value: RELEASE-NAME-drunk-app
  - equal:
      path: spec.minReplicas
      value: 1
  - equal:
      path: spec.maxReplicas
      value: 3
  - notExists:
      path: spec.behavior
  - equal:
      path: spec.metrics
      value: null

- it: should specify targetCPUUtilizationPercentage when provided
  set:
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 80
  asserts:
  - hasDocuments:
      count: 1
  - equal:
      path: spec.metrics[0].resource.name
      value: cpu
  - equal:
      path: spec.metrics[0].resource.target.averageUtilization
      value: 80

- it: should specify targetMemoryUtilizationPercentage when provided
  set:
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      targetMemoryUtilizationPercentage: 70
  asserts:
  - hasDocuments:
      count: 1
  - equal:
      path: spec.metrics[0].resource.name
      value: memory
  - equal:
      path: spec.metrics[0].resource.target.averageUtilization
      value: 70

- it: should specify both CPU and Memory utilization when both are provided
  set:
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 4
      targetCPUUtilizationPercentage: 60
      targetMemoryUtilizationPercentage: 65
  asserts:
  - hasDocuments:
      count: 1
  - equal:
      path: spec.metrics[0].resource.target.averageUtilization
      value: 60
  - equal:
      path: spec.metrics[1].resource.target.averageUtilization
      value: 65
  - notExists:
      path: spec.behavior
  - equal:
      path: spec.metrics
      value:
      - type: Resource
        resource:
          name: cpu
          target: {type: Utilization, averageUtilization: 60}
      - type: Resource
        resource:
          name: memory
          target: {type: Utilization, averageUtilization: 65}

- it: keeps HPA minReplicas when Deployment replicas are omitted
  set:
    autoscaling:
      enabled: true
      omitReplicas: true
      minReplicas: 2
      maxReplicas: 10
  asserts:
    - equal:
        path: spec.minReplicas
        value: 2

- it: passes scale up and scale down behavior through without adding defaults
  set:
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 10
      behavior: &scalingBehavior
        scaleUp:
          stabilizationWindowSeconds: 0
          selectPolicy: Max
          policies:
          - {type: Percent, value: 100, periodSeconds: 60}
          - {type: Pods, value: 4, periodSeconds: 30}
        scaleDown:
          stabilizationWindowSeconds: 300
          selectPolicy: Min
          policies:
          - {type: Pods, value: 1, periodSeconds: 60}
  asserts:
  - equal:
      path: spec.behavior
      value: *scalingBehavior
  - equal:
      path: spec.metrics
      value: null

- it: appends full metric specs after CPU and memory in the supplied order
  set:
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 10
      targetCPUUtilizationPercentage: 80
      targetMemoryUtilizationPercentage: 70
      metrics: &customMetrics
      - &podsMetric
        type: Pods
        pods:
          metric:
            name: requests_per_second
            selector: {matchLabels: {route: api}}
          target: {type: AverageValue, averageValue: "100"}
      - &externalMetric
        type: External
        external:
          metric:
            name: queue_depth
            selector: {matchLabels: {queue: jobs}}
          target: {type: Value, value: "30"}
      - &objectMetric
        type: Object
        object:
          describedObject: {apiVersion: networking.k8s.io/v1, kind: Ingress, name: api}
          metric: {name: requests_per_second}
          target: {type: Value, value: "1000"}
      - &containerMetric
        type: ContainerResource
        containerResource:
          name: cpu
          container: app
          target: {type: Utilization, averageUtilization: 75}
      - &resourceMetric
        type: Resource
        resource:
          name: memory
          target: {type: AverageValue, averageValue: 256Mi}
  asserts:
  - equal:
      path: spec.metrics
      value:
      - type: Resource
        resource:
          name: cpu
          target: {type: Utilization, averageUtilization: 80}
      - type: Resource
        resource:
          name: memory
          target: {type: Utilization, averageUtilization: 70}
      - *podsMetric
      - *externalMetric
      - *objectMetric
      - *containerMetric
      - *resourceMetric
  - notExists:
      path: spec.behavior

- it: renders custom metrics from index zero without CPU or memory targets
  set:
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 10
      metrics: *customMetrics
      behavior: *scalingBehavior
  asserts:
  - equal:
      path: spec.metrics
      value: *customMetrics
  - equal:
      path: spec.behavior
      value: *scalingBehavior

- it: preserves the bare metrics key and absent behavior for empty opt in values
  set:
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 10
      metrics: []
      behavior: {}
  asserts:
  - equal:
      path: spec.metrics
      value: null
  - notExists:
      path: spec.behavior

- it: keeps the HPA disabled even with behavior and custom metrics configured
  set:
    autoscaling:
      enabled: false
      behavior: *scalingBehavior
      metrics: *customMetrics
  asserts:
  - hasDocuments:
      count: 0
