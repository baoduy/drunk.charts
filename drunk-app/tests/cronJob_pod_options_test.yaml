suite: cronJob pod options
templates:
- cronjob.yaml
tests:
- it: no new fields or scheduling by default
  set:
    deployment: &workload_disabled
      enabled: false
    cronJobs:
    - name: task
      schedule: 0 2 * * *
  asserts:
  - notExists:
      path: spec.jobTemplate.spec.template.metadata
  - notExists:
      path: spec.jobTemplate.spec.template.spec.nodeSelector
  - notExists:
      path: spec.jobTemplate.spec.template.spec.tolerations
  - notExists:
      path: spec.jobTemplate.spec.template.spec.affinity
  - notExists:
      path: spec.jobTemplate.spec.template.spec.topologySpreadConstraints
  - notExists:
      path: spec.jobTemplate.spec.template.spec.priorityClassName
  - equal:
      path: spec.jobTemplate.spec.template.spec.containers[0].resources
      value:
        limits:
          cpu: 100m
          memory: 128Mi
        requests:
          cpu: 100m
          memory: 128Mi
- it: inherit only node scheduling
  set:
    deployment: *workload_disabled
    cronJobs:
    - name: task
      schedule: 0 2 * * *
    nodeSelector: &node_selector
      pool: apps
      disk: ssd
    tolerations: &app_tolerations
    - key: apps
      operator: Exists
      effect: NoSchedule
    affinity: &app_affinity
      nodeAffinity: &app_node_affinity
        requiredDuringSchedulingIgnoredDuringExecution:
          nodeSelectorTerms:
          - matchExpressions:
            - key: pool
              operator: In
              values:
              - apps
      podAffinity: &app_pod_affinity_terms
        requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app: web
          topologyKey: kubernetes.io/hostname
      podAntiAffinity: *app_pod_affinity_terms
    podAntiAffinityPreset: hard
    topologySpreadConstraints: &app_topology_spread
    - maxSkew: 1
      topologyKey: zone
      whenUnsatisfiable: DoNotSchedule
  asserts:
  - equal:
      path: spec.jobTemplate.spec.template.spec.nodeSelector
      value: *node_selector
  - equal:
      path: spec.jobTemplate.spec.template.spec.tolerations
      value: *app_tolerations
  - equal:
      path: spec.jobTemplate.spec.template.spec.affinity
      value: &node_affinity_only
        nodeAffinity: *app_node_affinity
  - notExists:
      path: spec.jobTemplate.spec.template.spec.topologySpreadConstraints
- it: pod scheduling without node affinity is never inherited
  set:
    deployment: *workload_disabled
    cronJobs:
    - name: task
      schedule: 0 2 * * *
    nodeSelector: *node_selector
    tolerations: *app_tolerations
    affinity:
      podAffinity: *app_pod_affinity_terms
      podAntiAffinity: *app_pod_affinity_terms
    podAntiAffinityPreset: hard
    topologySpreadConstraints: *app_topology_spread
  asserts:
  - equal:
      path: spec.jobTemplate.spec.template.spec.nodeSelector
      value: *node_selector
  - equal:
      path: spec.jobTemplate.spec.template.spec.tolerations
      value: *app_tolerations
  - notExists:
      path: spec.jobTemplate.spec.template.spec.affinity
  - notExists:
      path: spec.jobTemplate.spec.template.spec.topologySpreadConstraints
- it: preset is never applied to a job
  set:
    deployment: *workload_disabled
    cronJobs:
    - name: task
      schedule: 0 2 * * *
    nodeSelector: *node_selector
    tolerations: *app_tolerations
    affinity:
      nodeAffinity: *app_node_affinity
    podAntiAffinityPreset: hard
    topologySpreadConstraints: *app_topology_spread
  asserts:
  - equal:
      path: spec.jobTemplate.spec.template.spec.nodeSelector
      value: *node_selector
  - equal:
      path: spec.jobTemplate.spec.template.spec.tolerations
      value: *app_tolerations
  - equal:
      path: spec.jobTemplate.spec.template.spec.affinity
      value: *node_affinity_only
  - notExists:
      path: spec.jobTemplate.spec.template.spec.topologySpreadConstraints
- it: nodeSelector override replaces the app value
  set:
    deployment: *workload_disabled
    cronJobs:
    - name: task
      schedule: 0 2 * * *
      nodeSelector: &node_selector_2
        pool: batch
    nodeSelector: *node_selector
    tolerations: *app_tolerations
    affinity: *app_affinity
    podAntiAffinityPreset: hard
    topologySpreadConstraints: *app_topology_spread
  asserts:
  - equal:
      path: spec.jobTemplate.spec.template.spec.nodeSelector
      value: *node_selector_2
  - equal:
      path: spec.jobTemplate.spec.template.spec.tolerations
      value: *app_tolerations
  - equal:
      path: spec.jobTemplate.spec.template.spec.affinity
      value: *node_affinity_only
  - notExists:
      path: spec.jobTemplate.spec.template.spec.topologySpreadConstraints
- it: tolerations override replaces the app value
  set:
    deployment: *workload_disabled
    cronJobs:
    - name: task
      schedule: 0 2 * * *
      tolerations: &entry_tolerations
      - key: batch
        operator: Exists
    nodeSelector: *node_selector
    tolerations: *app_tolerations
    affinity: *app_affinity
    podAntiAffinityPreset: hard
    topologySpreadConstraints: *app_topology_spread
  asserts:
  - equal:
      path: spec.jobTemplate.spec.template.spec.nodeSelector
      value: *node_selector
  - equal:
      path: spec.jobTemplate.spec.template.spec.tolerations
      value: *entry_tolerations
  - equal:
      path: spec.jobTemplate.spec.template.spec.affinity
      value: *node_affinity_only
  - notExists:
      path: spec.jobTemplate.spec.template.spec.topologySpreadConstraints
- it: affinity override replaces the app value
  set:
    deployment: *workload_disabled
    cronJobs:
    - name: task
      schedule: 0 2 * * *
      affinity: &app_affinity_2
        podAffinity: *app_pod_affinity_terms
    nodeSelector: *node_selector
    tolerations: *app_tolerations
    affinity: *app_affinity
    podAntiAffinityPreset: hard
    topologySpreadConstraints: *app_topology_spread
  asserts:
  - equal:
      path: spec.jobTemplate.spec.template.spec.nodeSelector
      value: *node_selector
  - equal:
      path: spec.jobTemplate.spec.template.spec.tolerations
      value: *app_tolerations
  - equal:
      path: spec.jobTemplate.spec.template.spec.affinity
      value: *app_affinity_2
  - notExists:
      path: spec.jobTemplate.spec.template.spec.topologySpreadConstraints
- it: empty nodeSelector disables only that inheritance
  set:
    deployment: *workload_disabled
    cronJobs:
    - name: task
      schedule: 0 2 * * *
      nodeSelector: {}
    nodeSelector: *node_selector
    tolerations: *app_tolerations
    affinity: *app_affinity
    podAntiAffinityPreset: hard
    topologySpreadConstraints: *app_topology_spread
  asserts:
  - notExists:
      path: spec.jobTemplate.spec.template.spec.nodeSelector
  - equal:
      path: spec.jobTemplate.spec.template.spec.tolerations
      value: *app_tolerations
  - equal:
      path: spec.jobTemplate.spec.template.spec.affinity
      value: *node_affinity_only
  - notExists:
      path: spec.jobTemplate.spec.template.spec.topologySpreadConstraints
- it: empty tolerations disables only that inheritance
  set:
    deployment: *workload_disabled
    cronJobs:
    - name: task
      schedule: 0 2 * * *
      tolerations: []
    nodeSelector: *node_selector
    tolerations: *app_tolerations
    affinity: *app_affinity
    podAntiAffinityPreset: hard
    topologySpreadConstraints: *app_topology_spread
  asserts:
  - equal:
      path: spec.jobTemplate.spec.template.spec.nodeSelector
      value: *node_selector
  - notExists:
      path: spec.jobTemplate.spec.template.spec.tolerations
  - equal:
      path: spec.jobTemplate.spec.template.spec.affinity
      value: *node_affinity_only
  - notExists:
      path: spec.jobTemplate.spec.template.spec.topologySpreadConstraints
- it: empty affinity disables only that inheritance
  set:
    deployment: *workload_disabled
    cronJobs:
    - name: task
      schedule: 0 2 * * *
      affinity: {}
    nodeSelector: *node_selector
    tolerations: *app_tolerations
    affinity: *app_affinity
    podAntiAffinityPreset: hard
    topologySpreadConstraints: *app_topology_spread
  asserts:
  - equal:
      path: spec.jobTemplate.spec.template.spec.nodeSelector
      value: *node_selector
  - equal:
      path: spec.jobTemplate.spec.template.spec.tolerations
      value: *app_tolerations
  - notExists:
      path: spec.jobTemplate.spec.template.spec.affinity
  - notExists:
      path: spec.jobTemplate.spec.template.spec.topologySpreadConstraints
- it: overrides render without app scheduling
  set:
    deployment: *workload_disabled
    cronJobs:
    - name: task
      schedule: 0 2 * * *
      nodeSelector: *node_selector_2
      tolerations: *entry_tolerations
      affinity: *app_affinity_2
  asserts:
  - equal:
      path: spec.jobTemplate.spec.template.spec.nodeSelector
      value: *node_selector_2
  - equal:
      path: spec.jobTemplate.spec.template.spec.tolerations
      value: *entry_tolerations
  - equal:
      path: spec.jobTemplate.spec.template.spec.affinity
      value: *app_affinity_2
  - notExists:
      path: spec.jobTemplate.spec.template.spec.topologySpreadConstraints
- it: podLabels renders only supplied pod metadata
  set:
    deployment: *workload_disabled
    cronJobs:
    - name: task
      schedule: 0 2 * * *
      podLabels:
        team: batch
        flag: true
  asserts:
  - equal:
      path: spec.jobTemplate.spec.template.metadata.labels
      value:
        team: batch
        flag: 'true'
  - notExists:
      path: spec.jobTemplate.spec.template.metadata.annotations
- it: podAnnotations renders only supplied pod metadata
  set:
    deployment: *workload_disabled
    cronJobs:
    - name: task
      schedule: 0 2 * * *
      podAnnotations:
        tracking: task
        number: 23
  asserts:
  - equal:
      path: spec.jobTemplate.spec.template.metadata.annotations
      value:
        tracking: task
        number: '23'
  - notExists:
      path: spec.jobTemplate.spec.template.metadata.labels
- it: empty pod metadata maps render no metadata
  set:
    deployment: *workload_disabled
    cronJobs:
    - name: task
      schedule: 0 2 * * *
      podLabels: {}
      podAnnotations: {}
  asserts:
  - notExists:
      path: spec.jobTemplate.spec.template.metadata
- it: entry resources replace the top-level limits
  set:
    deployment: *workload_disabled
    cronJobs:
    - name: task
      schedule: 0 2 * * *
      resources: &container_resources
        requests:
          cpu: 250m
          memory: 256Mi
  asserts:
  - equal:
      path: spec.jobTemplate.spec.template.spec.containers[0].resources
      value: *container_resources
- it: empty resources clear the top-level resources
  set:
    deployment: *workload_disabled
    cronJobs:
    - name: task
      schedule: 0 2 * * *
      resources: {}
  asserts:
  - equal:
      path: spec.jobTemplate.spec.template.spec.containers[0].resources
      value: {}
- it: mixed entries keep their overrides isolated
  set:
    deployment: *workload_disabled
    cronJobs:
    - name: task
      schedule: 0 2 * * *
      nodeSelector: *node_selector_2
      tolerations: *entry_tolerations
      affinity: *app_affinity_2
      resources: *container_resources
      podLabels:
        team: batch
      podAnnotations:
        tracking: task
    - name: default
      schedule: 0 2 * * *
    - name: 'off'
      schedule: 0 2 * * *
      nodeSelector: {}
      tolerations: []
      affinity: {}
    nodeSelector: *node_selector
    tolerations: *app_tolerations
    affinity: *app_affinity
    podAntiAffinityPreset: hard
    topologySpreadConstraints: *app_topology_spread
  asserts:
  - equal:
      path: spec.jobTemplate.spec.template.spec.nodeSelector
      value: *node_selector_2
    documentIndex: 0
  - equal:
      path: spec.jobTemplate.spec.template.spec.tolerations
      value: *entry_tolerations
    documentIndex: 0
  - equal:
      path: spec.jobTemplate.spec.template.spec.affinity
      value: *app_affinity_2
    documentIndex: 0
  - notExists:
      path: spec.jobTemplate.spec.template.spec.topologySpreadConstraints
    documentIndex: 0
  - equal:
      path: spec.jobTemplate.spec.template.spec.nodeSelector
      value: *node_selector
    documentIndex: 1
  - equal:
      path: spec.jobTemplate.spec.template.spec.tolerations
      value: *app_tolerations
    documentIndex: 1
  - equal:
      path: spec.jobTemplate.spec.template.spec.affinity
      value: *node_affinity_only
    documentIndex: 1
  - notExists:
      path: spec.jobTemplate.spec.template.spec.topologySpreadConstraints
    documentIndex: 1
  - notExists:
      path: spec.jobTemplate.spec.template.spec.nodeSelector
    documentIndex: 2
  - notExists:
      path: spec.jobTemplate.spec.template.spec.tolerations
    documentIndex: 2
  - notExists:
      path: spec.jobTemplate.spec.template.spec.affinity
    documentIndex: 2
  - notExists:
      path: spec.jobTemplate.spec.template.spec.topologySpreadConstraints
    documentIndex: 2
  - equal:
      path: spec.jobTemplate.spec.template.metadata.labels
      value:
        team: batch
    documentIndex: 0
- it: custom top-level resources remain the default
  set:
    deployment:
      enabled: false
    cronJobs:
    - name: task
      schedule: 0 2 * * *
    resources: &container_resources_2
      limits:
        cpu: '1'
        memory: 1Gi
      requests:
        cpu: 500m
        memory: 512Mi
  asserts:
  - equal:
      path: spec.jobTemplate.spec.template.spec.containers[0].resources
      value: *container_resources_2
- it: job priorityClassName is outside the supported options
  set:
    deployment:
      enabled: false
      priorityClassName: app-high
    cronJobs:
    - name: task
      schedule: 0 2 * * *
      priorityClassName: batch-high
  asserts:
  - notExists:
      path: spec.jobTemplate.spec.template.spec.priorityClassName
