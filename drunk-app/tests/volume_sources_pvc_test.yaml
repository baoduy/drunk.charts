suite: volume sources pvc
templates:
- volumes.yaml
tests:
- it: ConfigMap creates no PVC
  set:
    volumes:
      input:
        mountPath: /input
        configMap:
          name: settings
          items:
          - key: app.conf
            path: app.conf
  asserts:
  - hasDocuments:
      count: 0
- it: Secret creates no PVC
  set:
    volumes:
      input:
        mountPath: /input
        secret:
          secretName: credentials
          defaultMode: 256
  asserts:
  - hasDocuments:
      count: 0
- it: projected creates no PVC
  set:
    volumes:
      input:
        mountPath: /input
        projected:
          sources:
          - configMap:
              name: settings
          - secret:
              name: credentials
  asserts:
  - hasDocuments:
      count: 0
- it: CSI creates no PVC
  set:
    volumes:
      input:
        mountPath: /input
        csi:
          driver: example.csi.k8s.io
          readOnly: true
          volumeAttributes:
            bucket: files
  asserts:
  - hasDocuments:
      count: 0
- it: memory emptyDir creates no PVC
  set:
    volumes:
      input:
        mountPath: /input
        emptyDir:
          medium: Memory
          sizeLimit: 64Mi
  asserts:
  - hasDocuments:
      count: 0
- it: legacy emptyDir true creates no PVC
  set:
    volumes:
      input:
        mountPath: /input
        emptyDir: true
  asserts:
  - hasDocuments:
      count: 0
- it: empty emptyDir map retains its mounted PVC
  set:
    volumes:
      cache:
        mountPath: /cache
        emptyDir: {}
  asserts:
  - hasDocuments:
      count: 1
  - equal:
      path: metadata.name
      value: drunk-app-cache
- it: untyped volume creates a PVC
  set:
    volumes:
      data:
        mountPath: /data
  asserts:
  - hasDocuments:
      count: 1
  - equal:
      path: metadata.name
      value: drunk-app-data
  - equal:
      path: spec.resources.requests.storage
      value: 2Gi
- it: emptyDir false retains its PVC
  set:
    volumes:
      data:
        emptyDir: false
        mountPath: /data
  asserts:
  - hasDocuments:
      count: 1
  - equal:
      path: metadata.name
      value: drunk-app-data
  - equal:
      path: spec.resources.requests.storage
      value: 2Gi
- it: emptyDir with only medium creates no PVC
  set:
    volumes:
      scratch:
        mountPath: /scratch
        emptyDir:
          medium: Memory
  asserts:
  - hasDocuments:
      count: 0
- it: emptyDir with only sizeLimit creates no PVC
  set:
    volumes:
      scratch:
        mountPath: /scratch
        emptyDir:
          sizeLimit: 64Mi
  asserts:
  - hasDocuments:
      count: 0
- it: conflicting configMap, secret sources fail rendering
  set:
    volumes:
      input:
        mountPath: /input
        configMap: &name
          name: settings
        secret: &secret_name
          secretName: credentials
  asserts:
  - failedTemplate:
      errorMessage: 'volumes: only one source key may be set; found configMap, secret'
- it: conflicting configMap, projected sources fail rendering
  set:
    volumes:
      input:
        mountPath: /input
        configMap: *name
        projected: &projected_sources
          sources: []
  asserts:
  - failedTemplate:
      errorMessage: 'volumes: only one source key may be set; found configMap, projected'
- it: conflicting configMap, csi sources fail rendering
  set:
    volumes:
      input:
        mountPath: /input
        configMap: *name
        csi: &driver
          driver: example.csi.k8s.io
  asserts:
  - failedTemplate:
      errorMessage: 'volumes: only one source key may be set; found configMap, csi'
- it: conflicting configMap, emptyDir sources fail rendering
  set:
    volumes:
      input:
        mountPath: /input
        configMap: *name
        emptyDir: &empty_map {}
  asserts:
  - failedTemplate:
      errorMessage: 'volumes: only one source key may be set; found configMap, emptyDir'
- it: conflicting secret, projected sources fail rendering
  set:
    volumes:
      input:
        mountPath: /input
        secret: *secret_name
        projected: *projected_sources
  asserts:
  - failedTemplate:
      errorMessage: 'volumes: only one source key may be set; found secret, projected'
- it: conflicting secret, csi sources fail rendering
  set:
    volumes:
      input:
        mountPath: /input
        secret: *secret_name
        csi: *driver
  asserts:
  - failedTemplate:
      errorMessage: 'volumes: only one source key may be set; found secret, csi'
- it: conflicting secret, emptyDir sources fail rendering
  set:
    volumes:
      input:
        mountPath: /input
        secret: *secret_name
        emptyDir: *empty_map
  asserts:
  - failedTemplate:
      errorMessage: 'volumes: only one source key may be set; found secret, emptyDir'
- it: conflicting projected, csi sources fail rendering
  set:
    volumes:
      input:
        mountPath: /input
        projected: *projected_sources
        csi: *driver
  asserts:
  - failedTemplate:
      errorMessage: 'volumes: only one source key may be set; found projected, csi'
- it: conflicting projected, emptyDir sources fail rendering
  set:
    volumes:
      input:
        mountPath: /input
        projected: *projected_sources
        emptyDir: *empty_map
  asserts:
  - failedTemplate:
      errorMessage: 'volumes: only one source key may be set; found projected, emptyDir'
- it: conflicting csi, emptyDir sources fail rendering
  set:
    volumes:
      input:
        mountPath: /input
        csi: *driver
        emptyDir: *empty_map
  asserts:
  - failedTemplate:
      errorMessage: 'volumes: only one source key may be set; found csi, emptyDir'
- it: conflicting configMap, secret, csi sources fail rendering
  set:
    volumes:
      input:
        mountPath: /input
        configMap: *name
        secret: *secret_name
        csi: *driver
  asserts:
  - failedTemplate:
      errorMessage: 'volumes: only one source key may be set; found configMap, secret,
        csi'
