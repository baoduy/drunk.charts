suite: statefulset env sources
templates:
- statefulset.yaml
tests:
- it: valueFrom pod-name on every container
  set:
    deployment: &workload_disabled
      enabled: false
    statefulset: &workload_enabled
      enabled: true
    global: &init_container_config
      initContainer:
        image: init:1
    env:
      SOURCE:
        valueFrom: &field_reference
          fieldRef:
            fieldPath: metadata.name
  asserts:
  - equal:
      path: spec.template.spec.containers[0].env[0]
      value:
        name: SOURCE
        valueFrom: *field_reference
  - notExists:
      path: spec.template.spec.containers[0].env[0].value
  - equal:
      path: spec.template.spec.initContainers[0].env[0]
      value:
        name: SOURCE
        valueFrom: *field_reference
  - notExists:
      path: spec.template.spec.initContainers[0].env[0].value
- it: valueFrom pod-namespace on every container
  set:
    deployment: *workload_disabled
    statefulset: *workload_enabled
    global: *init_container_config
    env:
      SOURCE:
        valueFrom: &field_reference_2
          fieldRef:
            fieldPath: metadata.namespace
  asserts:
  - equal:
      path: spec.template.spec.containers[0].env[0]
      value:
        name: SOURCE
        valueFrom: *field_reference_2
  - notExists:
      path: spec.template.spec.containers[0].env[0].value
  - equal:
      path: spec.template.spec.initContainers[0].env[0]
      value:
        name: SOURCE
        valueFrom: *field_reference_2
  - notExists:
      path: spec.template.spec.initContainers[0].env[0].value
- it: valueFrom secret on every container
  set:
    deployment: *workload_disabled
    statefulset: *workload_enabled
    global: *init_container_config
    env:
      SOURCE:
        valueFrom: &secret_key_reference
          secretKeyRef:
            name: credentials
            key: password
            optional: false
  asserts:
  - equal:
      path: spec.template.spec.containers[0].env[0]
      value:
        name: SOURCE
        valueFrom: *secret_key_reference
  - notExists:
      path: spec.template.spec.containers[0].env[0].value
  - equal:
      path: spec.template.spec.initContainers[0].env[0]
      value:
        name: SOURCE
        valueFrom: *secret_key_reference
  - notExists:
      path: spec.template.spec.initContainers[0].env[0].value
- it: valueFrom config-map on every container
  set:
    deployment: *workload_disabled
    statefulset: *workload_enabled
    global: *init_container_config
    env:
      SOURCE:
        valueFrom: &config_map_key_reference
          configMapKeyRef:
            name: settings
            key: mode
  asserts:
  - equal:
      path: spec.template.spec.containers[0].env[0]
      value:
        name: SOURCE
        valueFrom: *config_map_key_reference
  - notExists:
      path: spec.template.spec.containers[0].env[0].value
  - equal:
      path: spec.template.spec.initContainers[0].env[0]
      value:
        name: SOURCE
        valueFrom: *config_map_key_reference
  - notExists:
      path: spec.template.spec.initContainers[0].env[0].value
- it: valueFrom resource on every container
  set:
    deployment: *workload_disabled
    statefulset: *workload_enabled
    global: *init_container_config
    env:
      SOURCE:
        valueFrom: &resource_field_reference
          resourceFieldRef:
            containerName: worker
            resource: limits.cpu
            divisor: 1m
  asserts:
  - equal:
      path: spec.template.spec.containers[0].env[0]
      value:
        name: SOURCE
        valueFrom: *resource_field_reference
  - notExists:
      path: spec.template.spec.containers[0].env[0].value
  - equal:
      path: spec.template.spec.initContainers[0].env[0]
      value:
        name: SOURCE
        valueFrom: *resource_field_reference
  - notExists:
      path: spec.template.spec.initContainers[0].env[0].value
- it: plain value 'text' keeps the legacy string
  set:
    deployment: *workload_disabled
    statefulset: *workload_enabled
    global: *init_container_config
    env:
      PLAIN: text
  asserts:
  - equal:
      path: spec.template.spec.containers[0].env[0]
      value:
        name: PLAIN
        value: text
  - equal:
      path: spec.template.spec.initContainers[0].env[0]
      value:
        name: PLAIN
        value: text
- it: plain value '' keeps the legacy string
  set:
    deployment: *workload_disabled
    statefulset: *workload_enabled
    global: *init_container_config
    env:
      PLAIN: ''
  asserts:
  - equal:
      path: spec.template.spec.containers[0].env[0]
      value:
        name: PLAIN
        value: ''
  - equal:
      path: spec.template.spec.initContainers[0].env[0]
      value:
        name: PLAIN
        value: ''
- it: plain value False keeps the legacy string
  set:
    deployment: *workload_disabled
    statefulset: *workload_enabled
    global: *init_container_config
    env:
      PLAIN: false
  asserts:
  - equal:
      path: spec.template.spec.containers[0].env[0]
      value:
        name: PLAIN
        value: 'false'
  - equal:
      path: spec.template.spec.initContainers[0].env[0]
      value:
        name: PLAIN
        value: 'false'
- it: plain value 23 keeps the legacy string
  set:
    deployment: *workload_disabled
    statefulset: *workload_enabled
    global: *init_container_config
    env:
      PLAIN: 23
  asserts:
  - equal:
      path: spec.template.spec.containers[0].env[0]
      value:
        name: PLAIN
        value: '23'
  - equal:
      path: spec.template.spec.initContainers[0].env[0]
      value:
        name: PLAIN
        value: '23'
