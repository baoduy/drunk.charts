{{/*
GatewayClass is rendered ONLY when the vendored Traefik subchart is disabled.
Traefik (when `traefik.enabled` and `providers.kubernetesGateway.enabled` are
both true) creates its own GatewayClass named "traefik" with no opt-out flag,
so we step out of the way to prevent duplicate-resource errors. When the
subchart is enabled, keep `gatewayClass.name` in sync with Traefik's
GatewayClass name ("traefik").
*/}}
{{- if and .Values.gatewayClass.enabled (not (default false .Values.traefik.enabled)) }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gatewayClass.name }}
  labels:
    {{- include "gateway.labels" . | nindent 4 }}
    {{- with .Values.gatewayClass.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.gatewayClass.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  controllerName: {{ .Values.gatewayClass.controllerName }}
  {{- if .Values.gatewayClass.description }}
  description: {{ .Values.gatewayClass.description | quote }}
  {{- end }}
  {{- with .Values.gatewayClass.parametersRef }}
  parametersRef:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
