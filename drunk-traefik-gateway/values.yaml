# ClusterIssuer / Certificate configuration consumed by templates/clusterissuer.yaml
# and templates/certificate.yaml. Disabled by default; rendered output is
# unchanged unless enabled: true.
clusterIssuers:
  enabled: false
  issuers: []
    # - name: "letsencrypt-prod"
    #   spec:
    #     acme:
    #       email: "admin@drunk.dev"
    #       server: "https://acme-v02.api.letsencrypt.org/directory"
    #       privateKeySecretRef:
    #         name: "letsencrypt-prod-key"
    #       solvers:
    #         - http01:
    #             gatewayHTTPRoute:
    #               parentRefs:
    #                 - kind: Gateway
    #                   name: shared-gateway
    #                   namespace: default
    #         # For wildcard certificates, use DNS-01
    #         # - dns01:
    #         #     cloudflare:
    #         #       apiTokenSecretRef:
    #         #         name: cloudflare-api-token
    #         #         key: api-token

# Optional: sync a secret (e.g. a DNS-01 API token) from Azure Key Vault into a
# Kubernetes Secret via the Secrets Store CSI driver (templates/secretprovider.yaml).
# Disabled by default — backward-compat no-op. Fill in your own Key Vault details
# and set enabled: true to use it (e.g. as a ClusterIssuer DNS-01 solver secret).
secretProvider:
  enabled: false
  name: cf-dns-spc                       # SecretProviderClass resource name
  provider:
    name: azure
    tenantId: *tenantId
    userAssignedIdentityID: *userAssignedIdentityID
    vaultName: *vaultName
    usePodIdentity: false
    useWorkloadIdentity: false           # false → useVMManagedIdentity (node MSI)
  objects:
    - *cfDnsTokenName                     # AKV secret name(s) to sync
  secretName: cf-dns-secret               # K8s Secret name to materialize
  secretObjects:
    - key: token
      objectName: *cfDnsTokenName

# Route access configuration for automatically generated allowedRoutes when
# listener.allowedRoutes is omitted in values. Modes:
#  - All  : Allow routes from all namespaces
#  - Same : Allow routes only from same namespace as the Gateway
#  - List : Allow routes from a labeled set of namespaces (namespaces must already exist)
routeAccess:
  mode: "Same"
  # List of namespaces granted access when mode=List
  # These namespaces must already exist and be labeled with labelKey:labelValue
  namespaces: []
  # Label key applied to namespaces when mode=List
  labelKey: "gateway.drunk.charts/access"
  # Label value for selector (default falls back to Gateway name if empty)
  labelValue: ""

# Traefik deployment configuration via vendored subchart.
# When enabled, installs the traefik chart (version 33.2.0) with Kubernetes Gateway API support.
# NOTE: Gateway API CRDs must already be installed (this chart installs them automatically via gatewayAPI.enabled).
traefik:
  enabled: false
  # Disable default Gateway creation by Traefik (we manage our own)
  gateway:
    enabled: false
  # Enable Kubernetes Gateway provider
  providers:
    kubernetesGateway:
      enabled: true
  # Service configuration
  service:
    type: LoadBalancer
  # Ports configuration
  ports:
    web:
      port: 80
    websecure:
      port: 443
  # Resource limits
  resources:
    requests:
      cpu: "100m"
      memory: "50Mi"
    limits:
      cpu: "300m"
      memory: "150Mi"
